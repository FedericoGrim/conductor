name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit pytest
      - run: pre-commit run --all-files
      - run: pytest
