# Benchmark profiles (#65): one profile per candidate worker model.
# Every level is the same model and benchmark steps use difficulty 5, so each run is one attempt on one model.
# The reviewer is fixed so that only the worker changes between profiles.
default_privacy = "bench-deepseek-v4-flash-0731"

[privacy.bench-deepseek-v4-flash-0731]
max_parallel = 1
tiers = ["openrouter/deepseek/deepseek-v4-flash-0731", "openrouter/deepseek/deepseek-v4-flash-0731", "openrouter/deepseek/deepseek-v4-flash-0731", "openrouter/deepseek/deepseek-v4-flash-0731", "openrouter/deepseek/deepseek-v4-flash-0731"]
reviewer = "openrouter/openai/gpt-5.6-luna"

[privacy.bench-deepseek-v4-flash-0731.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
request_options = { provider = { data_collection = "deny" } }

